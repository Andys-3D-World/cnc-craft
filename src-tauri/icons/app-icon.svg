  <path d="M190 790 H452 V812 H572 V790 H834 V858 H190 Z" fill="#cfd5dc"/>
  <path d="M190 790 H452 V812 H572 V790 H834 V804 H190 Z" fill="#ffffff" fill-opacity="0.35"/>
