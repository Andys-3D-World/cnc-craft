  <rect x="452" y="150" width="120" height="290" rx="12" fill="url(#shank)"/>
  <!-- Schneiden -->
  <rect x="417" y="420" width="190" height="330" rx="10" fill="url(#cut)"/>
  <g clip-path="url(#body)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round">
    <path d="M400 470 L630 380 M400 560 L630 470 M400 650 L630 560 M400 740 L630 650 M400 830 L630 740"/>
  </g>
  <rect x="417" y="420" width="190" height="330" rx="10" fill="none" stroke="#1d1446" stroke-width="6"/>
  <!-- Funke / Lichtbogen -->
  <circle cx="512" cy="788" r="118" fill="url(#spark)"/>
  <g stroke="#ffd166" stroke-width="12" stroke-linecap="round">
    <path d="M512 788 L380 742 M512 788 L644 742 M512 788 L352 800 M512 788 L672 800"/>
