[package]
name = "cnc-craft"
version = "0.4.10"
description = "Open-Source CNC Control für Fräse, Plasma und Laser"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Andys-3D-World/cnc-craft"

[lib]
name = "cnc_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Update aus der App heraus (update.rs) – signierte Updates aus den GitHub-Releases
tauri-plugin-updater = "2"
# ZIP-Firmware (grblHAL Web Builder) entpacken – fwzip.rs
flate2 = "1"
# Systemschriften für das Text-Werkzeug lesen (fonts.rs) – nur Namen/Gewicht, kein Zeichnen
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: Kommazahlen aus dem Fenster genau einlesen (sonst bis zu eine letzte Stelle daneben) – die
# Rechen-Zwillinge müssen mit genau denselben Zahlen rechnen wie das TypeScript
serde_json = { version = "1", features = ["float_roundtrip"] }
serialport = "4"
# Gamepad lesen (gamepad.rs): das Fenster meldet Controller auf dem Mac nicht zuverlässig
gilrs = "0.11"
# USB für das K40-Original-Board (CH341). "vendored" baut libusb gleich mit – keine Extra-Installation nötig
rusb = { version = "0.9", features = ["vendored"] }
# 3D-Fräsen (cam3d.rs): Drop-Cutter und Höhenraster auf allen Kernen rechnen
rayon = "1"
# Modbus (modbus.rs, vfd.rs): Netzwerk + Zeitlimits. Tauri bringt tokio ohnehin mit – nur diese Teile einschalten
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
# Winkelfunktionen wie im Fenster (jsmath.rs): reines Rust, auf jedem Rechner dieselben Zahlen – die Rechen-Zwillinge
# (polyoffset.rs …) müssen bis zur letzten Stelle dasselbe liefern wie das TypeScript
libm = "0.2"

[dev-dependencies]
# nur für die Tests: Kommazahlen aus den Vergleichsdateien genau einlesen (sonst bis zu eine letzte Stelle daneben)
serde_json = { version = "1", features = ["float_roundtrip"] }

# Entwicklungs-Build (tauri dev): nur den eigenen Code optimieren. Ohne das rechnen die Rechen-Module (Bildgravur,
# G-Code lesen, 3D-Fraesen ...) im Entwicklungs-Build 10- bis 15-mal langsamer als in der fertigen App.
[profile.dev.package.cnc-craft]
opt-level = 2

# Ohne Zwischenspeicher für Teil-Übersetzungen: zusammen mit der Optimierung oben stürzte der Rust-Compiler sonst
# manchmal ab ("the compiler unexpectedly panicked", lto.rs) und half erst nach dem Löschen von target/debug/incremental.
[profile.dev]
incremental = false
