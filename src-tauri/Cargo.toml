[package]
name = "cnc-craft"
version = "0.3.1"
description = "Open-Source CNC Control für Fräse, Plasma und Laser"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Andys-3D-World/cnc-craft"

[lib]
name = "cnc_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Update aus der App heraus (update.rs) – signierte Updates aus den GitHub-Releases
tauri-plugin-updater = "2"
# ZIP-Firmware (grblHAL Web Builder) entpacken – fwzip.rs
flate2 = "1"
# Systemschriften für das Text-Werkzeug lesen (fonts.rs) – nur Namen/Gewicht, kein Zeichnen
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# USB für das K40-Original-Board (CH341). "vendored" baut libusb gleich mit – keine Extra-Installation nötig
rusb = { version = "0.9", features = ["vendored"] }
