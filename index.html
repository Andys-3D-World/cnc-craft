<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNC Craft</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-container">

      <!-- HAUPT-TABS (modern, mit Purple-Indikator) -->
      <nav class="tab-navigation">
        <div class="brand">
          <span class="brand-icon">🛠️</span> CNC<em>Craft</em>
        </div>
        <div class="tab-group">
          <button class="tab-content-btn active" data-tab="tab-cam">🎨 <span data-i18n="nav.cam">CAM / Design</span></button>
          <button class="tab-content-btn" data-tab="tab-sim">🎬 <span data-i18n="nav.sim">Simulation</span></button>
          <button class="tab-content-btn" data-tab="tab-flash">⚡ <span data-i18n="nav.flash">Board flashen</span></button>
          <button class="tab-content-btn" data-tab="tab-calibrate">⚙️ <span data-i18n="nav.calibrate">Einstellungen ($$)</span></button>
          <button class="tab-content-btn" data-tab="tab-wiring">🔌 <span data-i18n="nav.wiring">Anschlüsse</span></button>
          <button class="tab-content-btn" data-tab="tab-program"><span class="only-mill">🛠️ <span data-i18n="nav.tools">Werkzeuge</span></span><span class="only-laser">🔦 <span data-i18n="nav.laserLib">Laser-Bibliothek</span></span><span class="only-plasma">🔥 <span data-i18n="nav.plasmaLib">Plasma-Bibliothek</span></span></button>
        </div>
        <div class="tab-status">
          <button id="update-pill" class="update-pill" style="display:none;"></button>
          <button id="support-btn" class="about-btn support-btn" data-i18n-tip="support.btnTip">❤️</button>
          <button id="camera-btn" class="about-btn camera-btn" data-i18n-tip="cam.btnTip">📷</button>
          <button id="about-btn" class="about-btn" data-i18n-tip="upd.aboutTip">ⓘ</button>
          <div id="language-menu" class="language-menu"></div>
          <span class="connected-dot" id="header-conn-dot"></span>
          <span id="header-conn-text" data-i18n="nav.offline">Offline</span>
        </div>
      </nav>

      <!-- TAB-INHALTE -->
      <div class="tab-wrapper">

        <!-- TAB 1: CAM -->
        <div id="tab-cam" class="tab-content active">
          <main class="main-content">
            <nav id="dynamic-cam-panel" class="tool-strip"></nav>

            <section class="canvas-panel">
              <div id="editor-toolbar" class="editor-toolbar"></div>
              <div class="canvas-holder">
                <canvas id="cnc-canvas" width="600" height="500"></canvas>
              </div>
            </section>

            <aside id="dynamic-right-panel" class="right-panel"></aside>
          </main>
        </div>

        <!-- TAB: SIMULATION -->
        <div id="tab-sim" class="tab-content"></div>

        <!-- TAB 2: FIRMWARE FLASHEN -->
        <div id="tab-flash" class="tab-content">
          <div class="workshop-panel settings-panel" id="flash-page"></div>
        </div>

        <!-- TAB 3: MASCHINEN KALIBRIERUNG -->
        <div id="tab-calibrate" class="tab-content">
          <div class="workshop-panel settings-panel" id="settings-page"></div>
        </div>

        <!-- TAB: ANSCHLUSSPLAN – Inhalt baut src/ui/wiringPage.ts -->
        <div id="tab-wiring" class="tab-content">
          <div class="workshop-panel wiring-panel">
            <h2>🔌 <span data-i18n="wr.title">Anschlussplan</span></h2>
            <p class="panel-desc" data-i18n="wr.desc">So schließt du Motoren, Endschalter, Taster, Laser, Spindel und Plasma an dein Board an.</p>
            <div id="wiring-page"></div>
          </div>
        </div>

        <!-- TAB 4: BIBLIOTHEK je Modus – Fräse: src/ui/toolEditor.ts, Laser: src/ui/laserLibPage.ts,
             Plasma: src/ui/plasmaLibPage.ts, Sicherungs-Leiste: src/ui/libraryTab.ts -->
        <!-- data-view = gerade gezeigte Bibliothek (tools / laser / plasma), umschaltbar oben im Reiter;
             folgt beim Wechsel des Maschinen-Modus automatisch mit -->
        <div id="tab-program" class="tab-content" data-view="tools">
          <div class="workshop-panel tool-page-panel">
            <div id="lib-switch" class="lib-switch" role="tablist"></div>
            <div class="lib-titlebar">
              <div class="lib-titles">
                <h2 data-lib="tools">🛠️ <span data-i18n="lib.title">Werkzeug-Bibliothek</span></h2>
                <h2 data-lib="laser">🔦 <span data-i18n="llib.title">Laser-Bibliothek</span></h2>
                <h2 data-lib="plasma">🔥 <span data-i18n="plib.title">Plasma-Bibliothek</span></h2>
              </div>
              <div id="lib-bar" class="lib-bar"></div>
            </div>
            <p class="panel-desc" data-lib="tools" data-i18n="lib.desc">Hinterlege deine Fräswerkzeuge.</p>
            <p class="panel-desc" data-lib="laser" data-i18n="llib.desc">Deine Laser-Einstellungen je Material.</p>
            <p class="panel-desc" data-lib="plasma" data-i18n="plib.desc">Deine Plasma-Schnitte je Blech.</p>
            <div id="lib-mode-note" class="lib-mode-note" style="display:none;"></div>
            <div id="tool-page" data-lib="tools"></div>
            <div id="laser-lib-page" data-lib="laser"></div>
            <div id="plasma-lib-page" data-lib="plasma"></div>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
