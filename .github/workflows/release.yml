# Baut die Installationsdateien für macOS (Apple Silicon + Intel), Windows und Linux
# und legt sie als Entwurf eines GitHub-Release ab (Reiter "Releases" im Repository).
#
# Starten: GitHub → Actions → "Release bauen" → "Run workflow".
# Die Versionsnummer kommt aus src-tauri/tauri.conf.json ("version").
name: Release bauen

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon (M1/M2/M3 …)
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel-Mac
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux-Pakete (nur Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # webkit/gtk für das Fenster, libudev für die seriellen Ports
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev pkg-config

      - name: Frontend-Pakete installieren
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__-beta
          releaseName: "CNC Craft v__VERSION__ Beta"
          releaseBody: |
            Beta von CNC Craft – bitte testen und Fehler melden. Was neu ist: siehe CHANGELOG.md im Repository.

            macOS: .dmg öffnen und CNC Craft in „Programme“ ziehen. Beim ersten Start meldet macOS „nicht verifiziert“:
            Systemeinstellungen → Datenschutz & Sicherheit → „Trotzdem öffnen“.
            Windows: …-setup.exe ausführen (SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“).
            Linux: .AppImage ausführbar machen und starten, oder .deb installieren. Für serielle Ports: Benutzer in Gruppe „dialout“.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
